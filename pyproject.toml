[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-t2s"
version = "0.1.0"
description = "Convert Traditional Chinese PDFs to Simplified Chinese while preserving layout (Claude Code skill)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf",
    "opencc",
    "fonttools",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
    "pre-commit==4.6.2",
]

# 本仓库是 skill 分发包，不发布 Python 包；显式声明空包避免
# setuptools 自动发现到 scripts/ 导致构建歧义。
[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
