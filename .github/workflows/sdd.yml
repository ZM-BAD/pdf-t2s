# SDD gate installed by spooner transform Stage 4 (optional):
# spec files must exist — deleting them fails CI on purpose
# 所有分支全量运行（含分支 push），与 ci.yml 一致
name: sdd

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-exists:
    name: spec files exist (SDD gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check spec files exist (template + numbered specs + roadmap)
        run: test -f spec/000-spec-template.md && test -f spec/001-pdf-t2s-core.md && test -f spec/002-output-size-optimization.md && test -f spec/003-parallel-conversion.md && test -f spec/ROADMAP.md
