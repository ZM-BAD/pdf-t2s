# Quality gates (hard): UT + lint + format.
# 依赖与版本声明: pyproject.toml (dev extra) / uv.lock 为准，此处锁定一致。
# 三平台矩阵（004 跨平台）: 每平台跑 prepare_fonts（系统字体 + OFL 下载兜底）后
# 全量 pytest——9 个字体相关测试不再 SKIP（PDF_T2S_CI=1 时字体缺失会硬失败，
# 禁止静默跳过），spawn 并行/Windows 字体源/Noto 路径均被真实验证。
# opencc 冒烟防 Linux 共享库缺失（旧版 wheel 的坑）。
# 所有分支全量运行（含分支 push）——合并进 main 前分支上就必须全绿，
# main 上的运行只是兜底。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint + format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check .
      - name: ruff format (check only)
        run: ruff format --check .

  test:
    name: unit tests (pytest) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Install Linux CJK/Liberation fonts
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-liberation
      - run: pip install -r requirements.txt pytest==9.1.1
      - name: opencc smoke (bundled lib check)
        run: python -c "import opencc; assert opencc.OpenCC('t2s').convert('繁體') == '繁体'"
      - name: Prepare fonts (platform sources + OFL download fallback)
        run: python scripts/prepare_fonts.py
      - name: pytest (full suite incl. font-dependent tests)
        env:
          PYTHONUTF8: "1" # Windows 管道输出 UTF-8，防中文日志编码报错
          PDF_T2S_CI: "1" # 字体缺失时硬失败（禁止 SKIP 静默通过）
        run: python -m pytest -q -rs
