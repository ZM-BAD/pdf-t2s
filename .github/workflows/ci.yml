# Quality gates (hard): UT + lint + format.
# 依赖与版本声明: pyproject.toml (dev extra) / uv.lock 为准，此处锁定一致。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint + format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.3
      - name: ruff check
        run: ruff check .
      - name: ruff format (check only)
        run: ruff format --check .

  test:
    name: unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt pytest==9.1.1
      # scripts/t2s-*.ttf 为版权字体（prepare_fonts.py 从 macOS 系统字体提取），
      # 不入库，CI 上 8 个字体相关测试会 SKIP（13 passed, 8 skipped）；
      # 完整 21 个测试在本地 venv 全量运行（make test）。-rs 打印跳过原因。
      - name: pytest
        run: python -m pytest -q -rs
